name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
          cache: true

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      - name: Install OSXCross for macOS cross-compilation
        run: |
          # Install dependencies
          sudo apt-get install -y \
            clang \
            llvm \
            libxml2-dev \
            uuid-dev \
            libssl-dev \
            bash \
            patch \
            make \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            sed \
            cpio \
            libbz2-dev \
            zlib1g-dev

          # Clone OSXCross
          git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
          cd /tmp/osxcross

          # Download MacOSX SDK (using a public mirror)
          # Note: In production, you should cache this or use a more reliable source
          wget -nc https://github.com/joseluisq/macosx-sdks/releases/download/12.3/MacOSX12.3.sdk.tar.xz \
            -O tarballs/MacOSX12.3.sdk.tar.xz || true

          # Build OSXCross
          UNATTENDED=yes OSX_VERSION_MIN=10.13 ./build.sh

          # Add to PATH
          echo "/tmp/osxcross/target/bin" >> $GITHUB_PATH

          # Verify installation
          ls -la /tmp/osxcross/target/bin/

      - name: Verify cross-compilation toolchains
        run: |
          echo "=== Checking GCC (Linux AMD64) ==="
          gcc --version

          echo "=== Checking ARM64 cross-compiler ==="
          aarch64-linux-gnu-gcc --version

          echo "=== Checking MinGW (Windows) ==="
          x86_64-w64-mingw32-gcc --version

          echo "=== Checking OSXCross (macOS) ==="
          ls -la /tmp/osxcross/target/bin/ || echo "OSXCross not ready yet"

      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
